name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter / Release Asset"
        required: true
        type: string

      tag:
        description: "Tag build"
        required: true
        type: string

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:

      # ============================================================
      # 1. SETUP NODE
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"


      # ============================================================
      # 2. DOWNLOAD PROJECT ZIP
      # ============================================================
      - name: Download ZIP project
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          ZIP_URL: ${{ inputs.zip_url }}
        run: |
          set -e

          echo "======================================"
          echo "       DOWNLOAD PROJECT ZIP"
          echo "======================================"

          if [ -z "$ZIP_URL" ]; then
            echo "❌ zip_url kosong."
            exit 1
          fi

          if [ -z "$GH_TOKEN" ]; then
            echo "❌ Secret GH_TOKEN belum dibuat."
            echo ""
            echo "Buat secret:"
            echo "Repository → Settings → Secrets and variables → Actions"
            echo "Name: GH_TOKEN"
            exit 1
          fi

          echo "URL:"
          echo "$ZIP_URL"

          rm -f project.zip

          echo ""
          echo "Downloading..."

          HTTP_CODE=$(curl \
            --location \
            --fail-with-body \
            --silent \
            --show-error \
            --request GET \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/octet-stream" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$ZIP_URL" \
            --output project.zip \
            --write-out "%{http_code}")

          echo ""
          echo "HTTP Status: $HTTP_CODE"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== ZIP Validation ==="

          if ! unzip -t project.zip >/dev/null 2>&1; then
            echo ""
            echo "❌ FILE BUKAN ZIP VALID!"
            echo ""
            echo "Kemungkinan penyebab:"
            echo "1. GH_TOKEN salah / expired."
            echo "2. GH_TOKEN tidak punya akses ke repository Database."
            echo "3. URL release asset salah."
            echo "4. Release asset bersifat private."
            echo ""

            echo "=== Response dari server ==="

            if [ "$(stat -c%s project.zip)" -lt 100000 ]; then
              cat project.zip || true
            else
              head -c 1000 project.zip || true
            fi

            exit 1
          fi

          echo "✅ ZIP valid."


      # ============================================================
      # 3. EXTRACT PROJECT
      # ============================================================
      - name: Extract ZIP
        run: |
          set -e

          echo "======================================"
          echo "          EXTRACT PROJECT"
          echo "======================================"

          rm -rf project_raw
          mkdir -p project_raw

          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi project ==="
          find project_raw -maxdepth 2 -type f | head -100

          echo ""
          echo "=== Menentukan PROJECT_DIR ==="

          SUB_DIR_COUNT=$(find project_raw \
            -maxdepth 1 \
            -mindepth 1 \
            -type d | wc -l)

          FILE_COUNT=$(find project_raw \
            -maxdepth 1 \
            -mindepth 1 \
            -type f | wc -l)

          if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
            PROJECT_DIR=$(find project_raw \
              -maxdepth 1 \
              -mindepth 1 \
              -type d | head -n 1)
          else
            PROJECT_DIR="project_raw"
          fi

          echo ""
          echo "PROJECT_DIR=$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"


      # ============================================================
      # 4. CHECK PROJECT
      # ============================================================
      - name: Check Flutter Project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "          CHECK PROJECT"
          echo "======================================"

          if [ ! -f "pubspec.yaml" ]; then
            echo "❌ pubspec.yaml tidak ditemukan."
            echo ""
            echo "Isi folder:"
            find . -maxdepth 2 -type f | head -100
            exit 1
          fi

          echo "✅ pubspec.yaml ditemukan."

          echo ""
          echo "Project:"
          pwd

          echo ""
          echo "Files:"
          ls -la


      # ============================================================
      # 5. SETUP JAVA
      # ============================================================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"


      # ============================================================
      # 6. SETUP FLUTTER
      # ============================================================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true


      # ============================================================
      # 7. SHOW VERSIONS
      # ============================================================
      - name: Check Flutter Environment
        run: |
          echo "======================================"
          echo "       FLUTTER ENVIRONMENT"
          echo "======================================"

          flutter --version
          dart --version
          java -version


      # ============================================================
      # 8. GET DEPENDENCIES
      # ============================================================
      - name: Get Flutter Dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          echo "======================================"
          echo "       FLUTTER PUB GET"
          echo "======================================"

          flutter pub get


      # ============================================================
      # 9. ANALYZE
      # ============================================================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "======================================"
          echo "          FLUTTER ANALYZE"
          echo "======================================"

          flutter analyze || true


      # ============================================================
      # 10. STOP IF ANALYZE ONLY
      # ============================================================
      - name: Stop if Analyze Only
        if: ${{ inputs.only_analyze == true }}
        run: |
          echo "======================================"
          echo "       ANALYZE ONLY MODE"
          echo "======================================"

          echo "✅ Analyze selesai."
          echo "Build APK dilewati."

          exit 0


      # ============================================================
      # 11. BUILD APK
      # ============================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
        run: |
          set -e

          echo "======================================"
          echo "             BUILD APK"
          echo "======================================"

          echo "Build type: $BUILD_TYPE"

          if [ "$BUILD_TYPE" = "debug" ]; then

            echo ""
            echo "Building DEBUG APK..."

            flutter build apk --debug

          elif [ "$BUILD_TYPE" = "release" ]; then

            echo ""
            echo "Building RELEASE APK..."

            flutter build apk --release

          else

            echo "❌ Build type tidak valid:"
            echo "$BUILD_TYPE"

            exit 1

          fi


      # ============================================================
      # 12. FIND APK
      # ============================================================
      - name: Check APK Output
        run: |
          set -e

          echo "======================================"
          echo "          CHECK APK OUTPUT"
          echo "======================================"

          APK_FOUND=$(find "$GITHUB_WORKSPACE" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "❌ APK tidak ditemukan."
            echo ""
            echo "Mencari semua file:"
            find "$GITHUB_WORKSPACE" -type f | grep -E "\.(apk|aab)$" || true
            exit 1
          fi

          echo "✅ APK ditemukan:"
          echo "$APK_FOUND"

          echo ""
          echo "APK size:"
          ls -lh "$APK_FOUND"

          echo "APK_PATH=$APK_FOUND" >> "$GITHUB_ENV"


      # ============================================================
      # 13. UPLOAD APK
      # ============================================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ inputs.build_type }}-${{ inputs.tag }}
          path: ${{ env.APK_PATH }}
          retention-days: 7
          if-no-files-found: error


      # ============================================================
      # 14. BUILD SUMMARY
      # ============================================================
      - name: Build Summary
        if: success()
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          BUILD_TAG: ${{ inputs.tag }}
        run: |
          echo "======================================"
          echo "        BUILD BERHASIL"
          echo "======================================"

          echo "Tag        : $BUILD_TAG"
          echo "Build Type : $BUILD_TYPE"
          echo "APK        : $APK_PATH"

          echo ""
          echo "✅ APK sudah di-upload sebagai Artifact."
