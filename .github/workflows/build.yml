name: Build APK

# Dipicu oleh bot lewat GitHub API (workflow_dispatch), sesuai github.js -> triggerWorkflow()
on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL asset zip project (Flutter atau Android native)"
        required: true
      tag:
        description: "Tag / identifier build"
        required: true
      build_type:
        description: "debug atau release"
        required: false
        default: "release"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project zip dari release asset
        run: |
          curl -L \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip

      - name: Extract project
        run: |
          mkdir -p project
          unzip -q project.zip -d project

          # Kalau isi zip cuma 1 folder pembungkus (mis. "MyApp-main/"), naikkan isinya ke root project/
          shopt -s dotglob nullglob
          entries=(project/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ]; then
            inner="${entries[0]}"
            mv "$inner"/* project/ 2>/dev/null || true
            mv "$inner"/.[!.]* project/ 2>/dev/null || true
            rmdir "$inner" || true
          fi

      - name: Deteksi tipe project (Flutter / Android native)
        id: detect
        run: |
          if [ -f "project/pubspec.yaml" ]; then
            echo "type=flutter" >> "$GITHUB_OUTPUT"
            echo "Terdeteksi: Flutter project (pubspec.yaml ditemukan)"
          elif [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ] || \
               [ -f "project/build.gradle" ] || [ -f "project/build.gradle.kts" ]; then
            echo "type=android" >> "$GITHUB_OUTPUT"
            echo "Terdeteksi: Android native project (build.gradle/settings.gradle ditemukan)"
          else
            echo "type=unknown" >> "$GITHUB_OUTPUT"
          fi

      - name: Gagalkan build kalau tipe project tidak dikenali
        if: steps.detect.outputs.type == 'unknown'
        run: |
          echo "::error::Struktur project tidak dikenali. Wajib ada pubspec.yaml (Flutter) atau build.gradle / settings.gradle (Android native) di root zip."
          exit 1

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # ── Jalur Flutter ────────────────────────────────────────────────────
      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Flutter pub get
        if: steps.detect.outputs.type == 'flutter'
        working-directory: project
        run: flutter pub get

      - name: Build APK (Flutter)
        if: steps.detect.outputs.type == 'flutter'
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      # ── Jalur Android native (Java/Kotlin + Gradle) ────────────────────
      - name: Siapkan Gradle wrapper kalau belum ada
        if: steps.detect.outputs.type == 'android'
        working-directory: project
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew tidak ditemukan, generate wrapper baru..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x ./gradlew

      - name: Build APK (Android native)
        if: steps.detect.outputs.type == 'android'
        working-directory: project
        run: |
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            ./gradlew assembleRelease --no-daemon --stacktrace
          fi

      # ── Kumpulkan hasil build ───────────────────────────────────────────
      - name: Kumpulkan file APK hasil build
        run: |
          mkdir -p output
          find project -type f -iname "*.apk" -exec cp {} output/ \;

          count=$(find output -type f -iname "*.apk" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::Tidak ada file .apk yang ditemukan setelah proses build selesai."
            exit 1
          fi

          echo "Ditemukan $count file APK:"
          ls -la output

      - name: Upload APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-apk-${{ github.event.inputs.tag }}
          path: output/*.apk
          retention-days: 3
          if-no-files-found: error
