name: Build APK Universal

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: "Jenis project"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - flutter
          - android
      build_type:
        description: "Tipe build"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Detect Project
        id: detect
        shell: bash
        run: |
          TYPE="${{ github.event.inputs.project_type }}"

          if [ "$TYPE" = "auto" ]; then
            if [ -f "pubspec.yaml" ]; then
              TYPE="flutter"
            elif [ -f "gradlew" ] || [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
              TYPE="android"
            else
              echo "Project Flutter/Android tidak ditemukan."
              exit 1
            fi
          fi

          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Project terdeteksi: $TYPE"

      - name: Setup Flutter
        if: steps.detect.outputs.type == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true

      - name: Flutter Doctor
        if: steps.detect.outputs.type == 'flutter'
        run: flutter doctor -v

      - name: Flutter Dependencies
        if: steps.detect.outputs.type == 'flutter'
        run: flutter pub get

      - name: Build Flutter Release
        if: steps.detect.outputs.type == 'flutter' && github.event.inputs.build_type == 'release'
        run: flutter build apk --release

      - name: Build Flutter Debug
        if: steps.detect.outputs.type == 'flutter' && github.event.inputs.build_type == 'debug'
        run: flutter build apk --debug

      - name: Grant Gradle Permission
        if: steps.detect.outputs.type == 'android'
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Build Android Release
        if: steps.detect.outputs.type == 'android' && github.event.inputs.build_type == 'release'
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Android Debug
        if: steps.detect.outputs.type == 'android' && github.event.inputs.build_type == 'debug'
        run: ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p output

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./output/*" \
            -exec cp {} output/ \;

          echo "=== APK HASIL BUILD ==="
          ls -lh output/

          if ! find output -type f -name "*.apk" | grep -q .; then
            echo "APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.detect.outputs.type }}-${{ github.event.inputs.build_type }}
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
